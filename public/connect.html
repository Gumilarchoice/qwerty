<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hubungkan YouTube</title><style>body{font-family:system-ui;background:#090a0e;color:#fff;margin:0;padding:24px}.box{max-width:620px;margin:auto;background:#13151c;border:1px solid #303440;border-radius:22px;padding:22px}input,button{width:100%;box-sizing:border-box;padding:15px;border-radius:13px;border:1px solid #353946;background:#090a0e;color:#fff;font-size:16px}button{margin-top:12px;background:#ff3b30;border:0;font-weight:800}p{color:#aeb3c0;line-height:1.6}code{word-break:break-all;color:#8fe6d7}.state{padding:12px;border:1px solid #353946;border-radius:13px;margin-bottom:14px}</style><div class="box"><h1>Hubungkan channel</h1><div id="state" class="state">Memeriksa konfigurasi…</div><p>Redirect URI Google Cloud:</p><code id="uri"></code><p>Masukkan ADMIN_KEY, lalu login dengan akun Google pemilik channel.</p><input id="key" type="password" placeholder="ADMIN_KEY" autocomplete="current-password"><button id="go">Login dengan Google</button><p id="msg"></p></div><script>const uri=document.getElementById('uri'),state=document.getElementById('state'),key=document.getElementById('key'),go=document.getElementById('go'),msg=document.getElementById('msg');uri.textContent=location.origin+'/api/oauth-callback';fetch('/api/config',{cache:'no-store'}).then(r=>r.json()).then(d=>{const s=d.setup||{};state.textContent=s.googleChannelConnected?'Channel sudah terhubung.':s.googleClientConfigured?'Google Client siap. Lanjutkan login.':'GOOGLE_CLIENT_ID dan GOOGLE_CLIENT_SECRET belum aktif.'}).catch(()=>state.textContent='Status tidak dapat dibaca.');go.onclick=async()=>{go.disabled=true;msg.textContent='Membuka Google…';try{const r=await fetch('/api/oauth-start',{method:'POST',headers:{'x-admin-key':key.value}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal');location.href=d.url}catch(e){msg.textContent=e.message||String(e);go.disabled=false}}</script></html>
